<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.3" />
    </pattern>

    <style>
      <![CDATA[
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #f8fafc;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .node-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #cbd5e1;
      }

      /* Animated SVG Elements in Background and Flow Lines */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 60; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }

      .pulse-orb1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 7s ease-in-out infinite;
      }
      .pulse-orb2 {
        transform-origin: 1000px 300px;
        animation: pulseGlow 9s ease-in-out infinite alternate;
      }
      .animated-stream {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }
      .flow-card-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .flow-card-2 {
        animation: floatSlow 7s ease-in-out infinite 1s;
      }
      .flow-card-3 {
        animation: floatSlow 6.5s ease-in-out infinite 2s;
      }
      ]]>
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Glowing Orbs (Dynamic Ambience) -->
  <circle class="pulse-orb1" cx="200" cy="100" r="160" fill="url(#glowGrad1)" filter="url(#subtleGlow)" />
  <circle class="pulse-orb2" cx="1000" cy="300" r="180" fill="url(#glowGrad2)" filter="url(#subtleGlow)" />

  <!-- Decorative Pipeline / Flow in Background/Midground (Dynamic Flow Indicator) -->
  <g opacity="0.65">
    <path class="animated-stream" d="M 120 330 C 350 330, 450 345, 600 345 C 750 345, 850 320, 1080 320" fill="none" stroke="#6366f1" stroke-width="2.5" />
  </g>

  <!-- Dynamic Process Nodes (Positioned cleanly at bottom without obstructing titles) -->
  <g class="flow-card-1" transform="translate(180, 295)">
    <rect width="180" height="52" rx="10" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="26" r="10" fill="#3b82f6" fill-opacity="0.2" />
    <circle cx="28" cy="26" r="4" fill="#60a5fa" />
    <text x="50" y="23" class="node-text" font-weight="700">Contract Ingestion</text>
    <text x="50" y="38" font-size="10" fill="#94a3b8" font-family="sans-serif">AI Intake &amp; Parsing</text>
  </g>

  <g class="flow-card-2" transform="translate(510, 295)">
    <rect width="180" height="52" rx="10" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="26" r="10" fill="#8b5cf6" fill-opacity="0.2" />
    <circle cx="28" cy="26" r="4" fill="#a78bfa" />
    <text x="50" y="23" class="node-text" font-weight="700">Rule-Based Routing</text>
    <text x="50" y="38" font-size="10" fill="#94a3b8" font-family="sans-serif">Conditional Approvals</text>
  </g>

  <g class="flow-card-3" transform="translate(840, 295)">
    <rect width="180" height="52" rx="10" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" />
    <circle cx="28" cy="26" r="10" fill="#10b981" fill-opacity="0.2" />
    <circle cx="28" cy="26" r="4" fill="#34d399" />
    <text x="50" y="23" class="node-text" font-weight="700">Audit &amp; Execution</text>
    <text x="50" y="38" font-size="10" fill="#94a3b8" font-family="sans-serif">Immutable Sign-off</text>
  </g>

  <!-- FOREGROUND: Category Tag Badge -->
  <g transform="translate(435, 45)">
    <rect width="330" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="20" cy="16" r="4" fill="#ec4899">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="34" y="21" class="badge-text" fill="#c7d2fe">⚡ CURATED WORKFLOW &amp; CLM ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND: Main Title (Crisp, High Contrast, Guaranteed Foreground) -->
  <g id="main-heading">
    <text x="600" y="135" text-anchor="middle" class="title-text">
      Awesome Contract Approval Workflow Automation
    </text>
  </g>

  <!-- FOREGROUND: Subtitle -->
  <g id="sub-heading">
    <text x="600" y="178" text-anchor="middle" class="subtitle-text">
      Enterprise SaaS Marketplaces &amp; High-Performance Open-Source Orchestration Engines
    </text>
  </g>

  <!-- FOREGROUND: Feature Badges / Highlights -->
  <g transform="translate(240, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="82" y="19" text-anchor="middle" class="badge-text" fill="#93c5fd">📋 Multi-Stage Routing</text>

    <!-- Pill 2 -->
    <rect x="185" y="0" width="170" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="270" y="19" text-anchor="middle" class="badge-text" fill="#a5b4fc">⚖️ Legal &amp; Spend Rules</text>

    <!-- Pill 3 -->
    <rect x="375" y="0" width="165" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="457" y="19" text-anchor="middle" class="badge-text" fill="#f472b6">🔒 Audit Trail Logging</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="160" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="640" y="19" text-anchor="middle" class="badge-text" fill="#6ee7b7">🌐 Open-Source First</text>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="416" width="1200" height="4" rx="2" fill="url(#accentGrad)" />
</svg>
